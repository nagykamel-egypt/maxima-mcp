<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Maxima MCP Server architecture</title>
  <desc id="desc">An MCP client connects to the maxima-mcp server over stdio or Streamable HTTP. The server exposes tools, resources, prompts and persistent sessions, drives a Maxima process over a framed REPL, and indexes the offline HTML manual and Lisp source tree.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0A1322"/>
      <stop offset="1" stop-color="#0C1729"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111F35"/>
      <stop offset="1" stop-color="#0C1628"/>
    </linearGradient>
    <linearGradient id="cardStrong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263D"/>
      <stop offset="1" stop-color="#0C1A2E"/>
    </linearGradient>
    <linearGradient id="iconCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="iconTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="iconViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#3B4F70" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.38" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyanStart" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10 1 L2 6 L10 11" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowCyanEnd" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTealStart" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10 1 L2 6 L10 11" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTealEnd" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: Inter, "Inter Display", "Segoe UI", "DejaVu Sans", sans-serif; }
    .mono { font-family: "DejaVu Sans Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 56px; font-weight: 700; letter-spacing: -1.6px; fill: #F8FAFC; }
    .subtitle { font-size: 23px; font-weight: 400; fill: #A9B7CC; }
    .card-title { font-size: 28px; font-weight: 650; letter-spacing: -0.4px; fill: #F8FAFC; }
    .server-title { font-size: 36px; font-weight: 700; letter-spacing: -0.8px; fill: #FFFFFF; }
    .card-sub { font-size: 15px; font-weight: 500; fill: #8FA1BA; }
    .body { font-size: 16px; font-weight: 450; fill: #B9C6D9; }
    .small { font-size: 13px; font-weight: 500; fill: #8FA1BA; }
    .tiny { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #7F92AC; }
    .pill { font-size: 13px; font-weight: 600; fill: #D8E6F6; }
    .feature { font-size: 14px; font-weight: 550; fill: #C6D3E5; }
    .footer { font-size: 13px; font-weight: 500; fill: #6F829D; }
    .url { font-size: 14px; font-weight: 550; fill: #A9B7CC; }
    .label-top { font-size: 13px; font-weight: 600; fill: #A9B7CC; }
    .label-bottom { font-size: 11px; font-weight: 500; fill: #6F829D; }
  </style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="230" cy="120" rx="560" ry="390" fill="url(#glowCyan)" opacity="0.10"/>
  <ellipse cx="1430" cy="790" rx="500" ry="340" fill="url(#glowViolet)" opacity="0.10"/>
  <text x="1150" y="640" class="sans" font-size="330" font-weight="700" fill="#38BDF8" opacity="0.025">&#8747;</text>

  <!-- Header -->
  <rect x="80" y="50" width="232" height="34" rx="17" fill="#0C2636" stroke="#1C4B60" stroke-width="1"/>
  <circle cx="101" cy="67" r="4.5" fill="#2DD4BF"/>
  <text x="115" y="72" class="sans tiny" fill="#8FE3D6">MIT LICENSED &#183; v1.0.0</text>

  <text x="80" y="133" class="sans title">Maxima MCP Server</text>
  <text x="80" y="172" class="sans subtitle">A stateful symbolic-math workbench for LLM clients</text>

  <g transform="translate(1255 61)">
    <circle cx="15" cy="15" r="15" fill="#0E1A2C" stroke="#263853" stroke-width="1"/>
    <path d="M15 8.2c-3.9 0-7 3-7 6.8 0 3 1.9 5.5 4.6 6.4.3 0 .5-.1.5-.4v-1.4c-1.9.4-2.3-.8-2.3-.8-.3-.8-.8-1-0.8-1-0.6-.4 0-.4 0-.4.7 0 1.1.7 1.1.7.6 1.1 1.6.8 2 .6.1-.5.2-.8.4-1-1.5-.2-3.1-.8-3.1-3.4 0-.8.3-1.4.7-1.9-.1-.2-.3-.9.1-1.9 0 0 .6-.2 1.9.7.5-.2 1.1-.2 1.7-.2.6 0 1.2.1 1.7.2 1.3-.9 1.9-.7 1.9-.7.4 1 .2 1.7.1 1.9.4.5.7 1.1.7 1.9 0 2.6-1.6 3.2-3.1 3.4.2.2.5.7.5 1.4v2c0 .3.2.4.5.4 2.7-.9 4.6-3.3 4.6-6.4 0-3.8-3.1-6.8-7-6.8z" fill="#A9B7CC"/>
  </g>
  <text x="1520" y="80" text-anchor="end" class="sans url">nagykamel-egypt/maxima-mcp</text>
  <text x="1520" y="106" text-anchor="end" class="sans small" fill="#7F92AC">First public release &#183; 14 Nov 2026</text>

  <line x1="80" y1="199" x2="1520" y2="199" stroke="#1B2A42" stroke-width="1"/>

  <!-- Client card -->
  <g filter="url(#shadow)">
    <rect x="80" y="250" width="320" height="250" rx="20" fill="url(#card)" stroke="#263853" stroke-width="1.2"/>
  </g>
  <rect x="80" y="250" width="320" height="3" rx="1.5" fill="#38BDF8" opacity="0.75"/>
  <rect x="112" y="282" width="56" height="56" rx="15" fill="url(#iconCyan)" stroke="#38BDF8" stroke-opacity="0.35"/>
  <rect x="125" y="296" width="24" height="17" rx="3" fill="none" stroke="#E0F2FE" stroke-width="1.8"/>
  <path d="M129 316h16M137 316v5M132 321h10" fill="none" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M149 300h6a5 5 0 0 1 5 5v5a5 5 0 0 1-5 5h-2l-4 4v-4h-2a5 5 0 0 1-5-5v-5a5 5 0 0 1 5-5z" fill="#0B2B37" stroke="#67E8F9" stroke-width="1.6"/>
  <circle cx="151" cy="307.5" r="1.1" fill="#67E8F9"/>
  <circle cx="156" cy="307.5" r="1.1" fill="#67E8F9"/>
  <text x="184" y="311" class="sans card-title">MCP Client</text>
  <text x="184" y="338" class="sans card-sub">LLM &#183; IDE &#183; CLI</text>
  <line x1="112" y1="366" x2="368" y2="366" stroke="#22344D" stroke-width="1"/>
  <text x="112" y="398" class="sans body">Claude &#183; VS Code &#183; Cursor</text>
  <text x="112" y="424" class="sans body">OpenCode &#183; Codex &#183; Gemini</text>
  <rect x="112" y="449" width="256" height="32" rx="16" fill="#0A1B2B" stroke="#23415A"/>
  <text x="240" y="470" text-anchor="middle" class="sans pill">stdio / Streamable HTTP</text>

  <!-- Server card -->
  <g filter="url(#shadow)">
    <rect x="560" y="220" width="480" height="310" rx="24" fill="url(#cardStrong)" stroke="#2A4A67" stroke-width="1.4"/>
  </g>
  <rect x="562" y="222" width="476" height="4" rx="2" fill="url(#accent)"/>
  <rect x="600" y="260" width="64" height="64" rx="17" fill="#0B2438" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>
  <rect x="616" y="278" width="32" height="28" rx="5" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
  <path d="M608 286h8M608 298h8M648 286h8M648 298h8" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round"/>
  <text x="629" y="299" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#BAE6FD">M</text>
  <text x="684" y="294" class="sans server-title">maxima-mcp</text>
  <text x="684" y="322" class="sans card-sub">MCP server &#183; stateful runtime</text>

  <g>
    <rect x="600" y="353" width="122" height="34" rx="17" fill="#0B2A3E" stroke="#1E4D63"/>
    <circle cx="618" cy="370" r="3.5" fill="#38BDF8"/>
    <text x="630" y="375" class="sans pill">29 tools</text>

    <rect x="734" y="353" width="126" height="34" rx="17" fill="#0B2A3E" stroke="#1E4D63"/>
    <circle cx="752" cy="370" r="3.5" fill="#2DD4BF"/>
    <text x="764" y="375" class="sans pill">resources</text>

    <rect x="872" y="353" width="112" height="34" rx="17" fill="#0B2A3E" stroke="#1E4D63"/>
    <circle cx="890" cy="370" r="3.5" fill="#A78BFA"/>
    <text x="902" y="375" class="sans pill">prompts</text>
  </g>
  <g>
    <rect x="600" y="401" width="196" height="34" rx="17" fill="#0A2030" stroke="#1B4155"/>
    <circle cx="618" cy="418" r="3.5" fill="#FBBF24"/>
    <text x="630" y="423" class="sans pill">persistent sessions</text>

    <rect x="808" y="401" width="152" height="34" rx="17" fill="#0A2030" stroke="#1B4155"/>
    <circle cx="826" cy="418" r="3.5" fill="#FB7185"/>
    <text x="838" y="423" class="sans pill">docs + source</text>
  </g>
  <text x="600" y="472" class="sans small">process isolation &#183; per-session queues &#183; crash recovery</text>
  <text x="600" y="496" class="sans small">offline indexes &#183; BM25 search &#183; PNG / SVG plots</text>

  <!-- Maxima card -->
  <g filter="url(#shadow)">
    <rect x="1200" y="250" width="320" height="250" rx="20" fill="url(#card)" stroke="#263853" stroke-width="1.2"/>
  </g>
  <rect x="1200" y="250" width="320" height="3" rx="1.5" fill="#A78BFA" opacity="0.8"/>
  <rect x="1232" y="282" width="56" height="56" rx="15" fill="url(#iconViolet)" stroke="#A78BFA" stroke-opacity="0.4"/>
  <path d="M1247 325h26M1247 325V295M1247 325l8-8 7 4 10-16" fill="none" stroke="#EDE9FE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1272" cy="305" r="2.6" fill="#DDD6FE"/>
  <text x="1304" y="311" class="sans card-title">Maxima</text>
  <text x="1304" y="338" class="sans card-sub">Computer algebra system</text>
  <line x1="1232" y1="366" x2="1488" y2="366" stroke="#2B2C4A" stroke-width="1"/>
  <text x="1232" y="398" class="sans body">symbolic &#183; numeric &#183; calculus</text>
  <text x="1232" y="424" class="sans body">matrices &#183; plots &#183; packages</text>
  <rect x="1232" y="449" width="256" height="32" rx="16" fill="#17142B" stroke="#3E3566"/>
  <text x="1360" y="470" text-anchor="middle" class="sans pill">gnuplot &#183; PNG / SVG</text>

  <!-- Transport arrow -->
  <line x1="400" y1="380" x2="560" y2="380" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" marker-start="url(#arrowCyanStart)" marker-end="url(#arrowCyanEnd)"/>
  <text x="480" y="346" text-anchor="middle" class="sans label-top">stdio /</text>
  <text x="480" y="362" text-anchor="middle" class="sans label-top">Streamable HTTP</text>
  <text x="480" y="407" text-anchor="middle" class="sans label-bottom">MCP protocol</text>

  <!-- Maxima REPL arrow -->
  <line x1="1040" y1="380" x2="1200" y2="380" stroke="#2DD4BF" stroke-width="2.4" stroke-linecap="round" marker-start="url(#arrowTealStart)" marker-end="url(#arrowTealEnd)"/>
  <text x="1120" y="346" text-anchor="middle" class="sans label-top">framed REPL</text>
  <text x="1120" y="366" text-anchor="middle" class="sans label-bottom">stdin / stdout</text>
  <text x="1120" y="407" text-anchor="middle" class="sans label-bottom">crash-safe &#183; timeouts</text>

  <!-- Connector to offline indexes -->
  <path d="M800 530 V586" fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.75"/>
  <path d="M590 586 H1010" fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.55"/>
  <path d="M590 586 V620" fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.75"/>
  <path d="M1010 586 V620" fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.75"/>
  <circle cx="800" cy="586" r="4" fill="#2DD4BF"/>
  <circle cx="590" cy="620" r="3" fill="#2DD4BF"/>
  <circle cx="1010" cy="620" r="3" fill="#2DD4BF"/>

  <!-- Manual index card -->
  <g filter="url(#shadow)">
    <rect x="400" y="620" width="380" height="150" rx="18" fill="url(#card)" stroke="#263853" stroke-width="1.1"/>
  </g>
  <rect x="400" y="620" width="3" height="150" rx="1.5" fill="#38BDF8" opacity="0.75"/>
  <rect x="430" y="648" width="44" height="44" rx="12" fill="url(#iconCyan)" stroke="#38BDF8" stroke-opacity="0.35"/>
  <path d="M443 660h8a5 5 0 0 1 5 5v17a5 5 0 0 0-5-5h-8zM461 660h8v17h-8a5 5 0 0 0-5 5v-17a5 5 0 0 0 5-5z" fill="none" stroke="#E0F2FE" stroke-width="1.6" stroke-linejoin="round"/>
