  <text x="910" y="704" class="sans small" fill="#9EB0C7">symbol &#8594; definition &#183; regex search</text>
  <text x="910" y="728" class="sans small" fill="#7F92AC">packages &#183; source files</text>
  <rect x="1122" y="638" width="62" height="22" rx="11" fill="#17142B" stroke="#3E3566"/>
  <text x="1153" y="653" text-anchor="middle" class="sans" font-size="9" font-weight="700" letter-spacing="1" fill="#C4B5FD">OFFLINE</text>

