    <circle cx="8" cy="8" r="8" fill="#0E1A2C" stroke="#263853"/>
    <path d="M8 3.5c-2.5 0-4.5 2-4.5 4.4 0 2 1.2 3.6 3 4.2.2 0 .3-.1.3-.2v-.9c-1.2.3-1.5-.5-1.5-.5-.2-.5-.5-.6-.5-.6-.4-.3 0-.3 0-.3.4 0 .7.5.7.5.4.7 1 .5 1.3.4 0-.3.1-.5.3-.6-1-.1-2-.5-2-2.2 0-.5.2-.9.5-1.2-.1-.1-.2-.6 0-1.2 0 0 .4-.1 1.2.5.4-.1.7-.1 1.1-.1.4 0 .7 0 1.1.1.8-.6 1.2-.5 1.2-.5.2.6.1 1.1 0 1.2.3.3.5.7.5 1.2 0 1.7-1 2.1-2 2.2.2.1.3.4.3.9v1.3c0 .1.1.2.3.2 1.8-.6 3-2.2 3-4.2 0-2.4-2-4.4-4.5-4.4z" fill="#A9B7CC"/>
