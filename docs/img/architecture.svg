    <rect x="820" y="620" width="380" height="150" rx="18" fill="url(#card)" stroke="#263853" stroke-width="1.1"/>
  </g>
  <rect x="820" y="620" width="3" height="150" rx="1.5" fill="#A78BFA" opacity="0.8"/>
  <rect x="850" y="648" width="44" height="44" rx="12" fill="url(#iconViolet)" stroke="#A78BFA" stroke-opacity="0.35"/>
