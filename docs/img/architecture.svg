  <text x="490" y="704" class="sans small" fill="#9EB0C7">~2,900 symbols &#183; BM25 search</text>
  <text x="490" y="728" class="sans small" fill="#7F92AC">examples &#183; categories &#183; sections</text>
  <rect x="702" y="638" width="62" height="22" rx="11" fill="#0B2A3E" stroke="#1E4D63"/>
  <text x="733" y="653" text-anchor="middle" class="sans" font-size="9" font-weight="700" letter-spacing="1" fill="#67E8F9">OFFLINE</text>

  <!-- Source index card -->
