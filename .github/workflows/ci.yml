name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Maxima and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            maxima maxima-doc maxima-src maxima-share gnuplot

      - name: Verify system dependencies
        run: |
          maxima --version
          gnuplot --version
          test -f /usr/share/doc/maxima-doc/html/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test binary
        run: |
          node dist/index.js --version
          node dist/index.js --help >/dev/null
