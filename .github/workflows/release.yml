name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Maxima and tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            maxima maxima-doc maxima-src maxima-share gnuplot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack npm distribution
        run: npm pack

      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## maxima-mcp ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$version" '
              index($0, "## [" ver "]") == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md
          } > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "maxima-mcp $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" maxima-mcp-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "maxima-mcp $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              maxima-mcp-*.tgz
          fi
