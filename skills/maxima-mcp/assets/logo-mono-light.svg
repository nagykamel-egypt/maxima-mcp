<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">maxima-mcp skill monochrome mark (light)</title>
  <desc id="desc">A single-color geometric M monogram with three node cutouts, for dark backgrounds.</desc>
  <defs>
    <mask id="nodeCutouts">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="132" cy="166" r="7" fill="#000000"/>
      <circle cx="256" cy="294" r="7" fill="#000000"/>
      <circle cx="380" cy="166" r="7" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#nodeCutouts)" fill="#F2F7FF">
    <path d="M132 368 L132 166 L256 294 L380 166 L380 368"
          fill="none" stroke="#F2F7FF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="132" cy="166" r="18"/>
    <circle cx="256" cy="294" r="18"/>
    <circle cx="380" cy="166" r="18"/>
  </g>
</svg>
