<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">maxima-mcp skill logo</title>
  <desc id="desc">A geometric M monogram with three connected nodes and an integral-sign watermark on a dark rounded-square badge, using cyan, teal and violet accents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D18"/>
      <stop offset="0.55" stop-color="#0A1322"/>
      <stop offset="1" stop-color="#0C1729"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#5B7194" opacity="0.26"/>
    </pattern>

    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="badgeClip">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#badgeClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#dots)"/>
    <circle cx="256" cy="238" r="206" fill="url(#glow)"/>
  </g>
  <rect x="19.5" y="19.5" width="473" height="473" rx="108.5" fill="none" stroke="url(#border)" stroke-width="3"/>

  <!-- Integral sign watermark: calculus / CAS identity. -->
  <path d="M308 112 C282 112 274 134 270 170 L250 342 C246 378 234 400 208 400 C194 400 184 393 179 383"
        fill="none" stroke="#E6F3FF" stroke-opacity="0.055" stroke-width="20" stroke-linecap="round"/>

  <!-- Geometric M monogram. -->
  <path d="M132 368 L132 166 L256 294 L380 166 L380 368"
        fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Three MCP nodes at the M's key vertices. -->
  <g>
    <circle cx="132" cy="166" r="18" fill="#0A1322" stroke="#38BDF8" stroke-width="5"/>
    <circle cx="132" cy="166" r="6.5" fill="#38BDF8"/>
    <circle cx="256" cy="294" r="18" fill="#0A1322" stroke="#2DD4BF" stroke-width="5"/>
    <circle cx="256" cy="294" r="6.5" fill="#2DD4BF"/>
    <circle cx="380" cy="166" r="18" fill="#0A1322" stroke="#A78BFA" stroke-width="5"/>
    <circle cx="380" cy="166" r="6.5" fill="#A78BFA"/>
  </g>
</svg>
